name: Build macOS binary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "atuin/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-macos-artifact.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-zig-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}

      - name: Build atuin for Apple Silicon macOS
        run: cargo zigbuild -p atuin --locked --release --target aarch64-apple-darwin

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/atuin dist/atuin
          shasum -a 256 dist/atuin > dist/atuin.sha256
          file dist/atuin > dist/file.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: atuin-macos-aarch64
          path: dist/
